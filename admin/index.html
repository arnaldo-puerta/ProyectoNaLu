<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin | NALU</title>
    <meta name="theme-color" content="#FAF6F0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=GFS+Didot&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/nalu.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

    <!-- Pantallas de acceso: cargando, configuración inicial y contraseña -->
    <main class="acceso" id="acceso">
        <div class="acceso-caja">
            <a href="../index.html" class="logo" aria-label="Ir al sitio">
                <span class="logo-marca">NA<i></i>LU</span>
                <span class="logo-sub">ADMINISTRACIÓN</span>
            </a>
            <div id="acceso-contenido">
                <p class="acceso-cargando">Cargando…</p>
            </div>
        </div>
    </main>

    <!-- Panel de administración -->
    <div class="app" id="app" hidden>

        <header class="barra">
            <div class="barra-inner">
                <a href="../index.html" target="_blank" class="logo logo--chico" aria-label="Ver sitio">
                    <span class="logo-marca">NA<i></i>LU</span>
                </a>
                <p class="estado" id="estado" role="status"></p>
                <button class="btn btn--primario" id="publicar" disabled>Publicar</button>
            </div>
            <nav class="pestanas" role="tablist" aria-label="Secciones">
                <button role="tab" data-tab="productos" aria-selected="true">Productos</button>
                <button role="tab" data-tab="colecciones" aria-selected="false">Colecciones</button>
                <button role="tab" data-tab="enlaces" aria-selected="false">Enlaces</button>
                <button role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
            </nav>
        </header>

        <main class="contenido" id="contenido"></main>

    </div>

    <!-- Formulario en ventana (productos y colecciones) -->
    <dialog class="dialogo" id="dialogo">
        <form method="dialog" id="dialogo-form" novalidate></form>
    </dialog>

    <div class="aviso" id="aviso" role="status"></div>

    <script src="admin.js"></script>
</body>
</html>
